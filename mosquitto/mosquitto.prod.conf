# Production configuration (audit finding F2 of the security module).
#   - no anonymous client: every sensor has its own account (mosquitto_passwd)
#   - the per-sensor ACL lets LH-001 write only aeria/sensors/LH-001/measurements
#   - TLS on 8883; the plain 1883 listener is kept on the loopback for local tools only
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

listener 1883 127.0.0.1

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

max_packet_size 4096
max_queued_messages 10000
# a sensor publishes every 15 minutes: throttle anything that floods
max_inflight_messages 20
