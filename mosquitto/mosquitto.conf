# Development configuration. The port is only published on 127.0.0.1 (see docker-compose.yml).
# For production see "Hardening" in the README: TLS on 8883, password file, per-sensor ACL.
listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Readings are tiny JSON documents: refuse anything larger than 4 KiB.
max_packet_size 4096
max_queued_messages 10000
